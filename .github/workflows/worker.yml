name: Dashboard worker

# Deploys admin/worker to Cloudflare whenever it changes — but only once the
# repository has the Cloudflare credentials. Until then every step is skipped,
# so the workflow never fails for people who have not set it up yet.
#
# Needs (Settings → Secrets and variables → Actions):
#   secret  CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template token
#   secret  CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers → account id
#   variable D1_DATABASE_ID        from: npx wrangler d1 create m_calculator_stats
#   secret  ADMIN_EMAIL            the address that signs in to the dashboard
#           ADMIN_PASSWORD_HASH    node admin/worker/hash-password.mjs '…'
#
# Setup itself (database, schema, secrets) is one command: admin/worker/setup.sh

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "admin/worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the dashboard worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Are the Cloudflare credentials configured?
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID yet — skipping."
            echo "Run admin/worker/setup.sh once (see admin/README.md) and add:"
            echo "  secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_EMAIL, ADMIN_PASSWORD_HASH"
            echo "  variable D1_DATABASE_ID"
          fi

      - name: Point wrangler at the database
        if: steps.creds.outputs.ready == 'true'
        working-directory: admin/worker
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::warning::D1_DATABASE_ID is not set, keeping the id already in wrangler.toml"
          else
            python3 - "$D1_DATABASE_ID" << 'PY'
          import pathlib, re, sys
          database_id = sys.argv[1]
          path = pathlib.Path("wrangler.toml")
          text = path.read_text()
          text = re.sub(r'database_id\s*=\s*".*?"', f'database_id = "{database_id}"', text)
          path.write_text(text)
          print("wrangler.toml now points at", database_id)
          PY
          fi

      - name: Keep the tables up to date
        if: steps.creds.outputs.ready == 'true'
        working-directory: admin/worker
        run: npx --yes wrangler@3 d1 execute m_calculator_stats --remote --file=schema.sql || true

      - name: Store the admin sign-in
        if: steps.creds.outputs.ready == 'true' && env.ADMIN_PASSWORD_HASH != ''
        working-directory: admin/worker
        run: |
          if [ -n "$ADMIN_EMAIL" ]; then
            printf '%s' "$ADMIN_EMAIL" | npx --yes wrangler@3 secret put ADMIN_EMAIL
          fi
          printf '%s' "$ADMIN_PASSWORD_HASH" | npx --yes wrangler@3 secret put ADMIN_PASSWORD_HASH

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: admin/worker
        run: |
          set -o pipefail
          npx --yes wrangler@3 deploy 2>&1 | tee /tmp/deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          sleep 3
          echo "Dashboard: ${{ steps.deploy.outputs.url }}"
          curl -s --max-time 20 "${{ steps.deploy.outputs.url }}/health" || true
