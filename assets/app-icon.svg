<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 640 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242629"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <!-- Dark Button Gradient -->
    <linearGradient id="darkBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55585E"/>
      <stop offset="100%" stop-color="#35373B"/>
    </linearGradient>
    <!-- Orange Button Gradient -->
    <linearGradient id="orangeBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Subtle Shadows & Soft Depths -->
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)"/>
  <!-- Subtle Circuit Traces behind '=' Button -->
  <g stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" fill="none">
    <path d="M 330 265 V 235 H 310" />
    <path d="M 370 265 V 225 H 400" />
    <path d="M 270 330 H 240 V 310" />
    <path d="M 270 370 H 230 V 400" />
    <path d="M 330 435 V 455 H 310" />
    <path d="M 370 435 V 465 H 395" />
    <circle cx="310" cy="235" r="3" fill="#FF8A00" />
    <circle cx="400" cy="225" r="3" fill="#FF8A00" />
    <circle cx="240" cy="310" r="3" fill="#FF8A00" />
    <circle cx="230" cy="400" r="3" fill="#FF8A00" />
    <circle cx="310" cy="455" r="3" fill="#FF8A00" />
    <circle cx="395" cy="465" r="3" fill="#FF8A00" />
  </g>
  <!-- 1. Top-Left Button: Plus (+) -->
  <g filter="url(#buttonShadow)">
    <rect x="96" y="96" width="144" height="144" rx="46" fill="url(#darkBtnGrad)"/>
    <!-- Soft Inner Highlight -->
    <rect x="98" y="98" width="140" height="140" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <!-- Plus Symbol -->
    <path d="M 168 138 V 198 M 138 168 H 198" stroke="#F1F3F5" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- 2. Top-Right Button: Multiply (×) -->
  <g filter="url(#buttonShadow)">
    <rect x="272" y="96" width="144" height="144" rx="46" fill="url(#darkBtnGrad)"/>
    <rect x="274" y="98" width="140" height="140" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <!-- Cross Symbol -->
    <path d="M 323 147 L 365 189 M 365 147 L 323 189" stroke="#F1F3F5" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- 3. Bottom-Left Button: Minus (−) -->
  <g filter="url(#buttonShadow)">
    <rect x="96" y="272" width="144" height="144" rx="46" fill="url(#darkBtnGrad)"/>
    <rect x="98" y="274" width="140" height="140" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <!-- Minus Symbol -->
    <path d="M 138 344 H 198" stroke="#F1F3F5" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- 4. Bottom-Right Button: Equals (=) -->
  <g filter="url(#buttonShadow)">
    <rect x="272" y="272" width="144" height="144" rx="46" fill="url(#orangeBtnGrad)"/>
    <rect x="274" y="274" width="140" height="140" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <!-- Equals Symbol -->
    <path d="M 320 330 H 368 M 320 358 H 368" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- AI Neon Badge (Top Right) -->
  <g filter="url(#badgeShadow)">
    <!-- Badge Background Pill -->
    <rect x="336" y="66" width="94" height="50" rx="25" fill="#171A21" stroke="#00E5FF" stroke-width="2.5"/>
    <!-- AI Text -->
    <text x="366" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#E6FCFF" letter-spacing="1">AI</text>
    <!-- Sparkle Symbol -->
    <path d="M 408 81 C 408 87 413 91 419 91 C 413 91 408 95 408 101 C 408 95 403 91 397 91 C 403 91 408 87 408 81 Z" fill="#00E5FF"/>
  </g>
</svg>
