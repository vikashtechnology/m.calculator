# M Calculator usage stats — deploy with:  npx wrangler deploy
name = "m-calculator-stats"
main = "worker.js"
compatibility_date = "2024-09-23"

# Create the database once, then paste the id it prints:
#   npx wrangler d1 create m_calculator_stats
#   npx wrangler d1 execute m_calculator_stats --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "m_calculator_stats"
database_id = "3722e3f4-342e-4b9f-9327-34b1605e38e0"

# The dashboard password. Set it once, never commit it:
#   npx wrangler secret put ADMIN_EMAIL          (the address that signs in)
#   npx wrangler secret put ADMIN_PASSWORD_HASH  (node hash-password.mjs '…')
#
# [vars]
# ADMIN_EMAIL = "you@example.com"                  # then: wrangler dev --local
# ADMIN_PASSWORD_HASH = "pbkdf2$120000$…"          # node hash-password.mjs '…'

[observability]
enabled = true
