org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Optional: paste the *Web* OAuth client ID from the Google Cloud console here
# (or pass -PgoogleWebClientId=...) to enable the in-app "Continue with Google"
