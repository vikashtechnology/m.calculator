org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Ask AI normally runs on a key the *user* pastes into the app (free from
# aistudio.google.com). These two are only for builds that want a key of their
# own as a fallback for people who have not pasted one yet; CI passes the
# repository secret GEMINI_API_KEY here.
# geminiApiKey=AIza...
# geminiModel=gemini-3.6-flash

# AdMob — the real IDs for this app's AdMob account (app "AI Calculator").
# Delete these two lines to fall back to Google's public test units, which show
# a "Test Ad" banner and earn nothing.
admobAppId=ca-app-pub-7016837191893767~7695145778
admobBannerUnitId=ca-app-pub-7016837191893767/4338354697

# AGP 8.5.x was released before API 36; the compileSdk is deliberate so the app
# meets Google Play's target API level requirement (Android 16 from 2026-08-31).
android.suppressUnsupportedCompileSdk=36
