org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Optional: paste the *Web* OAuth client ID from the Google Cloud console here
# (or pass -PgoogleWebClientId=...) to enable the in-app "Continue with Google"
# button. Without it the app simply uses Puter's own sign-in, which also offers
# Google. The matching Android client must use this package name and the SHA-1
# in app/signing/fingerprints.txt.
# googleWebClientId=1234567890-abcdefghijklmnop.apps.googleusercontent.com

# Ask AI runs natively with a Google AI Studio key (aistudio.google.com > Get API
# key). The key belongs to your Google account, so the same account that signs in
# to the app pays for / tracks the usage. Without it the bundled Puter page is
# used instead. CI passes the repository secret GEMINI_API_KEY here.
# geminiApiKey=AIza...
# geminiModel=gemini-2.5-flash
#
# Better for users: point the app at the stats Worker instead. The Worker keeps
# the Gemini key as a secret, checks each user's Google sign-in and answers, so
# people only ever tap "Continue with Google". Needs GOOGLE_WEB_CLIENT_ID too.
# aiProxyUrl=https://m-calculator-stats.<your-name>.workers.dev
